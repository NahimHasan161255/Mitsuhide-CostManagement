<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Emerald / Growth Gradient (Profit & Cost Efficiency) -->
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Blue / Structure Gradient (Architecture / Construction) -->
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Gold / Value Gradient (Cost & Budget Mastery) -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Construction Structure / Pillar 1 (Left - Cost Input / Base) -->
  <rect x="12" y="32" width="10" height="20" rx="3" fill="url(#blueGrad)" />

  <!-- Construction Structure / Pillar 2 (Center - Budget & Progress) -->
  <rect x="27" y="22" width="10" height="30" rx="3" fill="url(#emeraldGrad)" />

  <!-- Construction Structure / Pillar 3 (Right - Value & Revenue) -->
  <rect x="42" y="14" width="10" height="38" rx="3" fill="url(#goldGrad)" />

  <!-- Cost Analytics Trend Line (Connecting Top Peaks with Dynamic Growth) -->
  <path d="M17 30 L32 20 L47 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="17" cy="30" r="2.5" fill="#ffffff" />
  <circle cx="32" cy="20" r="2.5" fill="#ffffff" />
  <circle cx="47" cy="12" r="3" fill="#fbbf24" stroke="#ffffff" stroke-width="1" />

  <!-- Japanese Architecture / Mitsuhide "M" Geometric Beam (Subtle Corporate Stamp) -->
  <path d="M12 48 L27 48 L37 48 L52 48" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round" />
</svg>
