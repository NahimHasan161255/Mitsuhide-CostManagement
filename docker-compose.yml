services:
  mysql:
    image: mysql:8.0
    container_name: mitsuhide-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mitsuhide_cost_db
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
      TZ: Asia/Tokyo
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - ./database/init_mitsuhide_db.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
